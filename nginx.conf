# <project>.docs.inhdy.com  ->  /srv/sites/<project>/
server {
    listen 80;
    server_name ~^(?<project>[a-z0-9]([a-z0-9-]*[a-z0-9])?)\.docs\.inhdy\.com$;
    root /srv/sites/$project;
    index index.html;
    server_tokens off;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }
    location ~ /\. { deny all; }
}

# docs.inhdy.com (and anything else Traefik sends here)  ->  project listing
server {
    listen 80 default_server;
    root /srv/sites/_root;
    index index.html;
    server_tokens off;

    location / {
        try_files $uri $uri/ =404;
    }
    location ~ /\. { deny all; }
}
