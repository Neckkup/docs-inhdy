<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>ALERT · หน้าเรือธง 3 หน้า</title>
<!--
  Canvas viewer — อ่าน ./canvas.json
  {
    "title": "ชื่อโปรเจกต์",
    "pages": [{"id": "p1", "name": "หน้า 1"}],          // ไม่ใส่ก็ได้ = page เดียว
    "boards": [{"file": "welcome.html", "title": "ยินดีต้อนรับ",
                "page": "p1", "x": 0, "y": 0, "w": 1440, "h": 1000}],  // x,y,w,h ไม่ใส่ก็ได้ = จัดเรียงให้
    "notes": [{"text": "หัวข้อ", "page": "p1", "x": 0, "y": -320, "kind": "title1"}]
  }
  หน้าใน board ได้ ?dark=1 เมื่อผู้ชมเปิดโหมดมืด
-->
<style>
:root { --bg:#e9e9e4; --dot:#c9c9c0; --fg:#1c1d17; --muted:#6b6d60; --ui:#ffffffee; --line:#d4d4ca; --hi:#2563eb; }
:root[data-theme="dark"] { --bg:#161714; --dot:#2c2d28; --fg:#ecede4; --muted:#a3a593; --ui:#23241fee; --line:#3a3c33; --hi:#60a5fa; }
* { box-sizing:border-box; }
html, body { margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--fg);
  font:14px/1.4 system-ui,-apple-system,"Noto Sans Thai",sans-serif; }
#vp { position:fixed; inset:0; overflow:hidden; touch-action:none; cursor:grab;
  background-image:radial-gradient(var(--dot) 1px, transparent 1px); }
#vp.drag { cursor:grabbing; }
#world { position:absolute; top:0; left:0; transform-origin:0 0; --inv:1; }
.board { position:absolute; display:block; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.12), 0 8px 24px rgba(0,0,0,.08); }
.board iframe { width:100%; height:100%; border:0; display:block; pointer-events:none; background:#fff; }
.board:hover, .board:focus-visible { outline:calc(2px * var(--inv)) solid var(--hi); }
.lbl { position:absolute; left:0; bottom:100%; padding-bottom:calc(8px * var(--inv)); white-space:nowrap;
  font-size:calc(13px * var(--inv)); color:var(--muted); font-weight:500; }
.note { position:absolute; font-weight:600; line-height:1.2; white-space:pre-wrap; }
.note.title1 { font-size:120px; }
.note.title2 { font-size:72px; }
.note.body { font-size:40px; font-weight:400; color:var(--muted); }
.ui { position:fixed; z-index:2; display:flex; align-items:center; gap:4px; padding:4px;
  background:var(--ui); border:1px solid var(--line); border-radius:10px; backdrop-filter:blur(8px);
  box-shadow:0 2px 10px rgba(0,0,0,.08); }
.ui button, .ui a { font:inherit; color:var(--fg); background:transparent; border:0; border-radius:7px;
  padding:7px 10px; cursor:pointer; text-decoration:none; white-space:nowrap; }
.ui button:hover, .ui a:hover { background:var(--line); }
.ui button[aria-pressed="true"] { background:var(--fg); color:var(--bg); }
#top { top:12px; left:12px; width:max-content; max-width:calc(100% - 24px); overflow-x:auto; }
#top .t { font-weight:600; padding:0 8px; }
#zoom { right:12px; bottom:12px; }
#zl { min-width:52px; text-align:center; font-variant-numeric:tabular-nums; }
#hint { left:12px; bottom:12px; color:var(--muted); padding:7px 12px; font-size:12px; }
#err { position:fixed; inset:0; display:none; place-items:center; color:var(--muted); }
@media (max-width:640px) { #hint { display:none; } }
</style>
</head>
<body>
<div id="vp"><div id="world"></div></div>
<nav class="ui" id="top">
  <a href="https://docs.inhdy.com/" title="เอกสารทั้งหมด">←</a>
  <span class="t" id="title"></span><span id="tabs" style="display:flex;gap:2px"></span>
</nav>
<div class="ui" id="zoom">
  <button id="theme" title="สลับโหมดมืด">☾</button>
  <button id="out" title="ซูมออก (-)">−</button><button id="zl" title="100% (1)">100%</button>
  <button id="in" title="ซูมเข้า (+)">+</button><button id="fit" title="พอดีจอ (0)">⤢</button>
</div>
<div class="ui" id="hint">ลากเพื่อเลื่อน · Ctrl+scroll หรือ pinch เพื่อซูม · คลิกหน้าเพื่อเปิด</div>
<div id="err"></div>
<script>
(async () => {
  const $ = id => document.getElementById(id);
  const vp = $('vp'), world = $('world'), zl = $('zl'), tabs = $('tabs');
  let D;
  try { D = await (await fetch('canvas.json', { cache: 'no-cache' })).json(); }
  catch (e) { $('err').style.display = 'grid'; $('err').textContent = 'อ่าน canvas.json ไม่ได้: ' + e.message; return; }

  D.pages = D.pages && D.pages.length ? D.pages : [{ id: null, name: '' }];
  const pid0 = D.pages[0].id;
  D.boards = (D.boards || []).map(b => ({ w: 1440, h: 1000, ...b, page: b.page ?? pid0, href: b.file || b.href }));
  D.notes = (D.notes || []).map(n => ({ ...n, page: n.page ?? pid0 }));
  // จัดเรียงอัตโนมัติ: board ที่ไม่มี x/y ไปต่อท้ายแถวล่างสุดของ page นั้น ทีละ 3
  for (const p of D.pages) {
    const mine = D.boards.filter(b => b.page === p.id);
    const placed = mine.filter(b => b.x != null && b.y != null);
    let y = placed.length ? Math.max(...placed.map(b => b.y + b.h)) + 220 : 0, x = 0, col = 0, rowH = 0;
    for (const b of mine.filter(b => b.x == null || b.y == null)) {
      b.x = x; b.y = y; rowH = Math.max(rowH, b.h);
      if (++col === 3) { col = 0; x = 0; y += rowH + 220; rowH = 0; } else x += b.w + 80;
    }
  }
  if (D.title) { $('title').textContent = D.title; document.title = D.title; }

  let s = 1, tx = 0, ty = 0, page = null, dark = false;
  try { dark = localStorage.getItem('dc-dark') === '1'; } catch (e) {}

  const apply = () => {
    world.style.transform = `translate(${tx}px,${ty}px) scale(${s})`;
    world.style.setProperty('--inv', 1 / s);
    const g = 24 * Math.max(s, 0.25);
    vp.style.backgroundSize = `${g}px ${g}px`;
    vp.style.backgroundPosition = `${tx}px ${ty}px`;
    zl.textContent = Math.round(s * 100) + '%';
  };
  const zoomAt = (f, cx, cy) => {
    const ns = Math.min(4, Math.max(0.03, s * f));
    tx = cx - (cx - tx) * ns / s; ty = cy - (cy - ty) * ns / s; s = ns; apply();
  };
  const center = () => [vp.clientWidth / 2, vp.clientHeight / 2];
  const fit = () => {
    const r = [
      ...D.boards.filter(b => b.page === page).map(b => [b.x, b.y - 40, b.x + b.w, b.y + b.h]),
      ...D.notes.filter(n => n.page === page).map(n => [n.x, n.y, n.x + Math.min(n.maxW || 1600, 1600), n.y + 160]),
    ];
    if (!r.length) return;
    const x0 = Math.min(...r.map(a => a[0])), y0 = Math.min(...r.map(a => a[1]));
    const x1 = Math.max(...r.map(a => a[2])), y1 = Math.max(...r.map(a => a[3]));
    const W = vp.clientWidth, H = vp.clientHeight, pad = 48, top = 64;
    s = Math.min((W - pad * 2) / (x1 - x0), (H - top - pad) / (y1 - y0), 1);
    tx = (W - (x1 - x0) * s) / 2 - x0 * s;
    ty = top + (H - top - pad - (y1 - y0) * s) / 2 - y0 * s;
    apply();
  };

  const src = href => href + (dark ? (href.includes('?') ? '&' : '?') + 'dark=1' : '');
  const show = pid => {
    page = pid;
    world.replaceChildren();
    D.notes.filter(n => n.page === pid).forEach(n => {
      const el = document.createElement('div');
      el.className = 'note ' + (n.kind || 'title1');
      el.textContent = n.text;
      Object.assign(el.style, { left: n.x + 'px', top: n.y + 'px', maxWidth: n.maxW ? n.maxW + 'px' : '' });
      world.append(el);
    });
    D.boards.filter(b => b.page === pid).forEach(b => {
      const el = document.createElement('a');
      el.className = 'board'; el.href = src(b.href); el.dataset.href = b.href;
      Object.assign(el.style, { left: b.x + 'px', top: b.y + 'px', width: b.w + 'px', height: b.h + 'px' });
      const lbl = document.createElement('div'); lbl.className = 'lbl'; lbl.textContent = b.title || b.href;
      const fr = document.createElement('iframe');
      fr.src = src(b.href); fr.loading = 'lazy'; fr.tabIndex = -1; fr.title = b.title || b.href; fr.setAttribute('scrolling', 'no');
      el.append(lbl, fr);
      world.append(el);
    });
    [...tabs.children].forEach(t => t.setAttribute('aria-pressed', t.dataset.id === pid));
    if (pid) history.replaceState(null, '', '#' + pid);
    fit();
  };

  if (D.pages.length > 1) D.pages.forEach(p => {
    const t = document.createElement('button');
    t.textContent = p.name || p.id; t.dataset.id = p.id; t.onclick = () => show(p.id);
    tabs.append(t);
  });

  const setTheme = () => {
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    $('theme').textContent = dark ? '☀' : '☾';
    world.querySelectorAll('.board').forEach(a => {
      a.href = src(a.dataset.href); a.querySelector('iframe').src = src(a.dataset.href);
    });
  };
  $('theme').onclick = () => { dark = !dark; try { localStorage.setItem('dc-dark', dark ? '1' : '0'); } catch (e) {} setTheme(); };
  $('in').onclick = () => zoomAt(1.25, ...center());
  $('out').onclick = () => zoomAt(0.8, ...center());
  $('zl').onclick = () => zoomAt(1 / s, ...center());
  $('fit').onclick = fit;

  vp.addEventListener('wheel', e => {
    e.preventDefault();
    const r = vp.getBoundingClientRect();
    if (e.ctrlKey || e.metaKey) zoomAt(Math.exp(-e.deltaY * 0.01), e.clientX - r.left, e.clientY - r.top);
    else { const k = e.deltaMode === 1 ? 16 : 1; tx -= e.deltaX * k; ty -= e.deltaY * k; apply(); }
  }, { passive: false });

  // ลาก / pinch — คลิกโดยไม่ลาก = เปิดหน้า
  const pts = new Map(); let moved = 0, last = null;
  const mid = () => { const p = [...pts.values()]; return [(p[0].x + p[1].x) / 2, (p[0].y + p[1].y) / 2, Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y)]; };
  vp.addEventListener('pointerdown', e => {
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    vp.setPointerCapture(e.pointerId); vp.classList.add('drag');
    if (pts.size === 1) moved = 0;
    last = pts.size === 2 ? mid() : null;
  });
  vp.addEventListener('pointermove', e => {
    const p = pts.get(e.pointerId); if (!p) return;
    const dx = e.clientX - p.x, dy = e.clientY - p.y;
    p.x = e.clientX; p.y = e.clientY;
    if (pts.size === 1) { tx += dx; ty += dy; moved += Math.abs(dx) + Math.abs(dy); apply(); }
    else if (pts.size === 2) {
      const m = mid(); moved = 99;
      if (last) { tx += m[0] - last[0]; ty += m[1] - last[1]; zoomAt(m[2] / last[2], m[0], m[1]); }
      last = m;
    }
  });
  const up = e => {
    pts.delete(e.pointerId); last = pts.size === 2 ? mid() : null;
    if (pts.size) return;
    vp.classList.remove('drag');
    if (e.type === 'pointerup' && moved <= 6 && e.button === 0) {
      const a = document.elementFromPoint(e.clientX, e.clientY)?.closest('.board');
      if (a) location.href = a.href;
    }
  };
  vp.addEventListener('pointerup', up); vp.addEventListener('pointercancel', up);
  vp.addEventListener('click', e => { if (e.detail !== 0) e.preventDefault(); }, true);

  addEventListener('keydown', e => {
    if (e.key === '+' || e.key === '=') zoomAt(1.25, ...center());
    else if (e.key === '-') zoomAt(0.8, ...center());
    else if (e.key === '0') fit();
    else if (e.key === '1') zoomAt(1 / s, ...center());
  });
  addEventListener('resize', fit);

  setTheme();
  const want = location.hash.slice(1), ids = D.pages.map(p => p.id);
  show(ids.includes(want) ? want : (ids.includes(D.launch) ? D.launch : ids[0]));
})();
</script>
</body>
</html>
