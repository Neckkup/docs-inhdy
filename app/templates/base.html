<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}จัดการเอกสาร{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <header class="top">
    <a class="brand" href="/">เอกสาร <small>{{ DOMAIN }}</small></a>
    {% if user %}
    <form method="post" action="/logout" class="who">
      <span>{{ user.username }}{% if user.is_admin %} · แอดมิน{% endif %}</span>
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <button class="link">ออกจากระบบ</button>
    </form>
    {% endif %}
  </header>
  <main>{% block body %}{% endblock %}</main>
</body>
</html>
