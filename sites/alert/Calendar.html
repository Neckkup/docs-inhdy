<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ปฏิทิน · ALERT</title>
<script src="./dc-lite.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.alert{--chrome:#ECEDE6;--surface:#FFFFFF;--surface-2:#F6F6F1;--surface-3:#EFEFE8;--selected:#FFFFFF;--border:#D9DACF;--border-strong:#B9BBAA;--track:#DCDDD2;--text:#1C1D17;--text-muted:#595B4D;--text-disabled:#9B9D8C;--primary:#5C5E4F;--primary-hover:#484A3E;--on-primary:#FFFFFF;--primary-soft:#E6E7DD;--accent:#7E5F32;--accent-soft:#F1E8D8;--rail:#35372E;--on-rail:#DCDDCD;--rail-hover:rgba(255,255,255,.06);--rail-active-bg:rgba(255,255,255,.10);--rail-active:#D9B97F;--success:#3B7549;--success-soft:#E3EFE6;--warning:#935D10;--warning-soft:#F6EAD3;--danger:#B0412E;--danger-soft:#F5E1DC;--info:#3B6B8F;--info-soft:#DFE9F1;--shadow-xs:0 1px 3px rgba(35,36,29,.12);--shadow-sm:0 2px 6px rgba(35,36,29,.08),0 1px 2px rgba(35,36,29,.06);color-scheme:light;font-family:'Kanit','Noto Sans Thai',system-ui,sans-serif;font-weight:300;font-size:15px;line-height:1.6;color:var(--text);background:var(--chrome)}
.alert.dark{color-scheme:dark;--chrome:#121310;--surface:#1E1F1A;--surface-2:#24251F;--surface-3:#2A2B24;--selected:#2A2B24;--border:#33352D;--border-strong:#4A4C41;--track:#3A3C33;--text:#ECEDE4;--text-muted:#A9AB98;--text-disabled:#5E6053;--primary:#B4B79C;--primary-hover:#C8CAB3;--on-primary:#1A1B16;--primary-soft:#33352B;--accent:#D4B17C;--accent-soft:#3A3224;--rail:#2A2C23;--success:#7FBF8E;--success-soft:#1F3326;--warning:#E0A955;--warning-soft:#3A2C17;--danger:#E08A76;--danger-soft:#3B221C;--info:#86B2D4;--info-soft:#1C2C38;--shadow-xs:0 1px 3px rgba(0,0,0,.40);--shadow-sm:0 2px 6px rgba(0,0,0,.45)}
.alert *{box-sizing:border-box}
.alert button,.alert input{font-family:inherit}
.alert :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.alert .rail-item:hover{background:var(--rail-hover);color:#FFFFFF}
.alert .rail-item:focus-visible{outline-color:var(--rail-active)}
.alert .icon-btn:hover,.alert .btn2:hover{background:var(--surface-3);color:var(--text)}
.alert .btn1:hover{background:var(--primary-hover)}
.alert .ev:hover{box-shadow:var(--shadow-sm)}
@media (max-width:640px){
.alert .shell{flex-direction:column-reverse}
.alert .rail{flex-direction:row !important;width:100% !important;margin:0 !important;border-radius:0 !important;justify-content:space-around;padding:6px 0 !important}
.alert .rail-secondary,.alert .rail-more{display:none !important}
.alert .main{margin:0 !important;border-radius:0 !important;padding:20px 16px !important}
.alert .search{display:none !important}
}
</style>
</helmet>
<div class="alert {{theme}}" style="min-height: 1000px; display: flex; flex-direction: column;">

<header style="height: 60px; flex-shrink: 0; display: flex; align-items: center; gap: 16px; padding: 0 16px 0 0;">
<a href="#" style="width: 72px; display: flex; flex-direction: column; align-items: center; color: var(--primary); text-decoration: none; font-size: 12px; font-weight: 600; line-height: 1.2;">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"></path><path d="m9 12 2 2 4-4"></path></svg>
ALERT</a>
<div style="flex: 1; display: flex; justify-content: center; min-width: 0;">
<label class="search" style="width: 100%; max-width: 720px; height: 40px; display: flex; align-items: center; gap: 10px; padding: 0 14px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; color: var(--text-muted);">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
<span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">ค้นหา</span>
<input type="search" placeholder="ค้นหาหลักสูตร บทเรียน ไฟล์ หรือบุคคล" style="flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--text); font-size: 15px; font-weight: 300;">
</label>
</div>
<div style="display: flex; align-items: center; gap: 8px;">
<button type="button" class="icon-btn" aria-label="สลับธีมสว่าง/มืด" style="width: 40px; height: 40px; border: 0; border-radius: 8px; background: transparent; color: var(--text-muted); display: flex; align-items: center; justify-content: center; cursor: pointer;">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path></svg>
</button>
<div style="position: relative; width: 40px; height: 40px; border-radius: 999px; border: 1px solid var(--border); background: var(--primary-soft); color: var(--primary); display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 500;" aria-label="ส.อ. กฤชชัย (ออนไลน์)">กช
<span aria-hidden="true" style="position: absolute; right: -1px; bottom: -1px; width: 11px; height: 11px; border-radius: 999px; background: var(--success); border: 2px solid var(--chrome);"></span>
</div>
</div>
</header>

<div class="shell" style="flex: 1; display: flex; min-height: 0;">

<nav class="rail" aria-label="เมนูหลัก" style="width: 72px; flex-shrink: 0; margin: 0; padding: 8px 0 10px; border-radius: 0; background: var(--rail); display: flex; flex-direction: column; align-items: center; gap: 4px;">
<a href="#" class="rail-item" style="position: relative; width: 64px; padding: 8px 0 6px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; font-weight: 400; line-height: 1.3; text-decoration: none; color: var(--on-rail);">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"></path><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
หน้าหลัก</a>
<a href="#" class="rail-item" style="position: relative; width: 64px; padding: 8px 0 6px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; font-weight: 400; line-height: 1.3; text-decoration: none; color: var(--on-rail);">
<span style="position: absolute; top: 2px; right: 10px; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 999px; background: #E08A76; color: #1A1B16; border: 2px solid var(--rail); font-size: 11px; font-weight: 600; line-height: 14px; text-align: center;">5</span>
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg>
กิจกรรม</a>
<a href="#" class="rail-item" style="position: relative; width: 64px; padding: 8px 0 6px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; font-weight: 400; line-height: 1.3; text-decoration: none; color: var(--on-rail);">
<span style="position: absolute; top: 2px; right: 10px; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 999px; background: #E08A76; color: #1A1B16; border: 2px solid var(--rail); font-size: 11px; font-weight: 600; line-height: 14px; text-align: center;">3</span>
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"></path></svg>
แชท</a>
<a href="#" class="rail-item" style="position: relative; width: 64px; padding: 8px 0 6px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; font-weight: 400; line-height: 1.3; text-decoration: none; color: var(--on-rail);">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
ห้องเรียน</a>
<a href="#" class="rail-item" aria-current="page" style="position: relative; width: 64px; padding: 8px 0 6px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; font-weight: 500; line-height: 1.3; text-decoration: none; color: var(--rail-active); background: var(--rail-active-bg);">
<span aria-hidden="true" style="position: absolute; left: -4px; top: 50%; width: 4px; height: 24px; margin-top: -12px; border-radius: 4px; background: var(--rail-active);"></span>
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="18" x="3" y="4" rx="2"></rect><path d="M16 2v4M8 2v4M3 10h18"></path></svg>
ปฏิทิน</a>
<a href="#" class="rail-item rail-more" style="position: relative; width: 64px; padding: 8px 0 6px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; font-weight: 400; line-height: 1.3; text-decoration: none; color: var(--on-rail);">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="8" height="4" x="8" y="2" rx="1"></rect><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path><path d="m9 14 2 2 4-4"></path></svg>
งาน</a>
<a href="#" class="rail-item rail-more" style="position: relative; width: 64px; padding: 8px 0 6px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; font-weight: 400; line-height: 1.3; text-decoration: none; color: var(--on-rail);">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m16 13 5.223 3.482a.5.5 0 0 0 .777-.416V7.87a.5.5 0 0 0-.752-.432L16 10.5"></path><rect x="2" y="6" width="14" height="12" rx="2"></rect></svg>
เรียนสด</a>
<a href="#" class="rail-item rail-more" style="position: relative; width: 64px; padding: 8px 0 6px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; font-weight: 400; line-height: 1.3; text-decoration: none; color: var(--on-rail);">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"></path></svg>
ไฟล์</a>
<a href="#" class="rail-item rail-more" style="position: relative; width: 64px; padding: 8px 0 6px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; font-weight: 400; line-height: 1.3; text-decoration: none; color: var(--on-rail);">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"></path><path d="M19 3v4"></path><path d="M17 5h4"></path></svg>
ผู้ช่วย</a>
<a href="#" class="rail-item rail-more" style="position: relative; width: 64px; padding: 8px 0 6px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; font-weight: 400; line-height: 1.3; text-decoration: none; color: var(--on-rail);">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m16 6 4 14"></path><path d="M12 6v14"></path><path d="M8 8v12"></path><path d="M4 4v16"></path></svg>
ความรู้</a>
<div class="rail-secondary" style="flex: 1;"></div>
<div class="rail-secondary" aria-hidden="true" style="width: 32px; height: 1px; margin: 2px 0; background: rgba(255,255,255,.12);"></div>
<a href="#" class="rail-item rail-secondary" style="position: relative; width: 64px; padding: 8px 0 6px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; font-weight: 400; line-height: 1.3; text-decoration: none; color: var(--on-rail);">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="7" height="7" x="3" y="3" rx="1"></rect><rect width="7" height="7" x="14" y="3" rx="1"></rect><rect width="7" height="7" x="14" y="14" rx="1"></rect><rect width="7" height="7" x="3" y="14" rx="1"></rect></svg>
แอป</a>
<a href="#" class="rail-item rail-secondary" style="position: relative; width: 64px; padding: 8px 0 6px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; font-weight: 400; line-height: 1.3; text-decoration: none; color: var(--on-rail);">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path><path d="M12 17h.01"></path></svg>
ช่วยเหลือ</a>
</nav>

<main class="main" style="flex: 1 1 560px; min-width: 0; margin: 0 12px 12px 12px; padding: 28px 32px 32px; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; display: flex; flex-direction: column; gap: 20px;">

<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px;">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px;">
<h1 style="margin: 0 8px 0 0; font-size: 24px; font-weight: 500; line-height: 1.35;">ปฏิทิน</h1>
<button type="button" class="btn2" style="height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--border-strong); background: var(--surface); color: var(--text); font-size: 13px; font-weight: 400; cursor: pointer;">วันนี้</button>
<div style="display: flex; gap: 2px;">
<button type="button" class="icon-btn" aria-label="สัปดาห์ก่อน" style="width: 32px; height: 32px; border: 0; border-radius: 8px; background: transparent; color: var(--text-muted); display: flex; align-items: center; justify-content: center; cursor: pointer;">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>
</button>
<button type="button" class="icon-btn" aria-label="สัปดาห์ถัดไป" style="width: 32px; height: 32px; border: 0; border-radius: 8px; background: transparent; color: var(--text-muted); display: flex; align-items: center; justify-content: center; cursor: pointer;">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>
</button>
</div>
<span style="font-size: 18px; font-weight: 500;">2–6 พฤศจิกายน 2569</span>
</div>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px;">
<div role="group" aria-label="มุมมอง" style="display: flex; gap: 4px; padding: 3px; border-radius: 999px; border: 1px solid var(--border);">
<button type="button" aria-pressed="false" style="height: 30px; padding: 0 14px; border-radius: 999px; border: 0; background: transparent; color: var(--text-muted); font-size: 13px; font-weight: 400; cursor: pointer;">วัน</button>
<button type="button" aria-pressed="true" style="height: 30px; padding: 0 14px; border-radius: 999px; border: 0; background: var(--primary); color: var(--on-primary); font-size: 13px; font-weight: 400; cursor: pointer;">สัปดาห์งาน</button>
<button type="button" aria-pressed="false" style="height: 30px; padding: 0 14px; border-radius: 999px; border: 0; background: transparent; color: var(--text-muted); font-size: 13px; font-weight: 400; cursor: pointer;">เดือน</button>
</div>
<button type="button" class="btn1" style="height: 40px; padding: 0 22px; display: inline-flex; align-items: center; gap: 8px; border-radius: 10px; border: 0; background: var(--primary); color: var(--on-primary); font-size: 15px; font-weight: 400; cursor: pointer;">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg>
เพิ่มกิจกรรม</button>
</div>
</div>

<ul aria-label="คำอธิบายสี" style="margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 8px 20px; font-size: 13px; font-weight: 400; color: var(--text-muted);">
<li style="display: flex; align-items: center; gap: 6px;"><span aria-hidden="true" style="width: 14px; height: 14px; border-radius: 4px; background: var(--primary-soft); border: 1px solid var(--border-strong);"></span>คาบเรียน</li>
<li style="display: flex; align-items: center; gap: 6px;"><span aria-hidden="true" style="width: 14px; height: 14px; border-radius: 4px; background: var(--info-soft); border: 1px solid var(--info);"></span>เรียนสดออนไลน์</li>
<li style="display: flex; align-items: center; gap: 6px;"><span aria-hidden="true" style="width: 14px; height: 14px; border-radius: 4px; background: var(--warning-soft); border: 1px solid var(--warning);"></span>สอบ</li>
<li style="display: flex; align-items: center; gap: 6px;"><span aria-hidden="true" style="width: 14px; height: 14px; border-radius: 4px; background: var(--success-soft); border: 1px solid var(--success);"></span>ฝึกภาคสนาม</li>
</ul>

<div style="border: 1px solid var(--border); border-radius: 14px; overflow-x: auto;">
<div style="min-width: 760px;">
<div style="display: flex; border-bottom: 1px solid var(--border); background: var(--surface-2);">
<div style="width: 64px; flex-shrink: 0;"></div>
<sc-for list="{{days}}" as="d" hint-placeholder-count="5">
<div style="{{d.headStyle}}">
<span style="{{d.labelStyle}}">{{d.label}}</span>
<span style="{{d.dateStyle}}">{{d.date}}</span>
</div>
</sc-for>
</div>
<div style="display: flex;">
<div style="width: 64px; flex-shrink: 0;">
<sc-for list="{{hours}}" as="h" hint-placeholder-count="9">
<div style="height: 60px; padding: 2px 10px 0 0; text-align: right; font-size: 12px; font-weight: 400; color: var(--text-muted); font-variant-numeric: tabular-nums;">{{h.label}}</div>
</sc-for>
</div>
<sc-for list="{{days}}" as="d" hint-placeholder-count="5">
<div style="{{d.colStyle}}">
<sc-for list="{{hours}}" as="h" hint-placeholder-count="9">
<div style="height: 60px; border-top: 1px solid var(--border);"></div>
</sc-for>
<sc-if value="{{d.today}}" hint-placeholder-val="{{ false }}">
<div aria-label="เวลาปัจจุบัน 10:40" style="position: absolute; left: 0; right: 0; top: 160px; height: 2px; background: var(--danger); z-index: 2;">
<span style="position: absolute; left: -5px; top: -4px; width: 10px; height: 10px; border-radius: 999px; background: var(--danger);"></span>
</div>
</sc-if>
<sc-for list="{{d.events}}" as="e" hint-placeholder-count="3">
<a href="#" class="ev" style="{{e.style}}">
<span style="font-size: 13px; font-weight: 500; line-height: 1.35; color: var(--text);">{{e.title}}</span>
<span style="font-size: 12px; font-weight: 400; line-height: 1.4; color: var(--text-muted);">{{e.meta}}</span>
</a>
</sc-for>
</div>
</sc-for>
</div>
</div>
</div>
</main>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    var bg = { cls: 'var(--primary-soft)', live: 'var(--info-soft)', exam: 'var(--warning-soft)', field: 'var(--success-soft)' };
    var bd = { cls: 'var(--border-strong)', live: 'var(--info)', exam: 'var(--warning)', field: 'var(--success)' };
    function ev(s, e, title, meta, t) {
      var top = (s - 8) * 60 + 2;
      var h = (e - s) * 60 - 4;
      return {
        title: title,
        meta: meta,
        style: 'position: absolute; left: 4px; right: 4px; top: ' + top + 'px; height: ' + h + 'px; padding: 6px 8px; border-radius: 8px; border: 1px solid ' + bd[t] + '; background: ' + bg[t] + '; display: flex; flex-direction: column; gap: 2px; overflow: hidden; text-decoration: none; z-index: 1;'
      };
    }
    var raw = [
      { label: 'จ.', date: '2', events: [
        ev(8.5, 10, 'ยุทธวิธีหน่วยเล็ก', '08:30–10:00 · ห้อง 204', 'cls'),
        ev(10.25, 11.75, 'แผนที่และเข็มทิศ', '10:15–11:45 · ห้อง 301', 'cls'),
        ev(13, 14.5, 'การสื่อสารทางทหาร', '13:00–14:30 · ห้องวิทยุ', 'cls'),
        ev(15, 16.5, 'พลศึกษา', '15:00–16:30 · สนามกีฬา', 'field')
      ] },
      { label: 'อ.', date: '3', events: [
        ev(8.5, 11.75, 'ฝึกภาคสนาม: อ่านแผนที่', '08:30–11:45 · พื้นที่ฝึก ข', 'field'),
        ev(13, 14.5, 'ภาวะผู้นำทางทหาร', '13:00–14:30 · เรียนสด', 'live')
      ] },
      { label: 'พ.', date: '4', events: [
        ev(8.5, 10, 'การปฐมพยาบาลในสนาม', '08:30–10:00 · ห้อง 105', 'cls'),
        ev(10.25, 11, 'สอบย่อย: การอ่านพิกัด', '10:15–11:00', 'exam'),
        ev(13, 16, 'ปฐมพยาบาลภาคปฏิบัติ', '13:00–16:00 · โรงพยาบาลค่าย', 'field')
      ] },
      { label: 'พฤ.', date: '5', today: true, events: [
        ev(8.5, 10, 'ยุทธวิธีหน่วยเล็ก', '08:30–10:00 · ห้อง 204', 'cls'),
        ev(10.25, 11.75, 'แผนที่และเข็มทิศ', '10:15–11:45 · ภาคปฏิบัติ', 'cls'),
        ev(13, 14.5, 'ภาวะผู้นำทางทหาร', '13:00–14:30 · เรียนสด', 'live'),
        ev(15, 16.5, 'พลศึกษา', '15:00–16:30 · สนามกีฬา', 'field')
      ] },
      { label: 'ศ.', date: '6', events: [
        ev(9, 10.5, 'สอบย่อย: ปฐมพยาบาล', '09:00–10:30 · ทำในระบบ', 'exam'),
        ev(13, 15, 'ทบทวนก่อนสอบปลายภาค', '13:00–15:00 · เรียนสด', 'live'),
        ev(15.5, 16.5, 'ประชุมรุ่น 12', '15:30–16:30 · หอประชุม', 'cls')
      ] }
    ];
    var days = raw.map(function (d) {
      return {
        label: d.label,
        date: d.date,
        today: !!d.today,
        events: d.events,
        headStyle: 'flex: 1; min-width: 0; padding: 10px 12px; border-left: 1px solid var(--border); display: flex; align-items: center; gap: 8px;',
        labelStyle: 'font-size: 13px; font-weight: ' + (d.today ? '500' : '400') + '; color: ' + (d.today ? 'var(--text)' : 'var(--text-muted)') + ';',
        dateStyle: d.today
          ? 'width: 36px; height: 36px; border-radius: 999px; background: var(--primary); color: var(--on-primary); display: inline-flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 500;'
          : 'font-size: 22px; font-weight: 400; color: var(--text);',
        colStyle: 'flex: 1; min-width: 0; position: relative; border-left: 1px solid var(--border); background: ' + (d.today ? 'var(--surface-2)' : 'transparent') + ';'
      };
    });
    var hours = [];
    for (var h = 8; h < 17; h++) hours.push({ label: (h < 10 ? '0' : '') + h + ':00' });
    return { theme: this.props.dark ? 'dark' : '', days: days, hours: hours };
