{% extends "base.html" %}
{% block title %}เข้าสู่ระบบ{% endblock %}
{% block body %}
<section class="card narrow">
  <h1>เข้าสู่ระบบ</h1>
  {% if error %}<p class="err">{{ error }}</p>{% endif %}
  <form method="post" action="/login" class="stack">
    <label>ชื่อผู้ใช้<input name="username" autocomplete="username" required autofocus></label>
    <label>รหัสผ่าน<input name="password" type="password" autocomplete="current-password" required></label>
    <button class="primary">เข้าสู่ระบบ</button>
  </form>
  <p class="muted small">ยังไม่มีบัญชี? ขอให้แอดมินสร้างให้</p>
</section>
{% endblock %}
